name: Build macOS application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS arm64 DMG
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build and verify application disk image
        env:
          SEEG_BUILD_PYTHON: python
        run: ./scripts/build_macos.sh

      - name: Store workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: seeg-localizer-macos-arm64
          path: dist/*.dmg*
          if-no-files-found: error
          compression-level: 0

      - name: Create draft release and upload disk image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_assets=(dist/*.dmg dist/*.dmg.sha256)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" --draft --generate-notes --title "sEEG Localizer $GITHUB_REF_NAME"
          fi
